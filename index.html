<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자유 게시판</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><header><p class="eyebrow">COMMUNITY BOARD</p><h1>자유 게시판</h1><p>게시글을 조회하고 제목으로 검색할 수 있습니다.</p></header><section class="card"><div class="heading"><div><h2>회원</h2><p id="accountEmail">로그인하면 게시글을 작성할 수 있습니다.</p></div><button id="logoutButton" hidden>로그아웃</button></div><div id="authForms" class="auth"><form id="signUpForm"><h3>회원가입</h3><label>이메일<input name="email" type="email" required></label><label>비밀번호<input name="password" type="password" minlength="6" required></label><button id="signUpButton">회원가입</button></form><form id="signInForm"><h3>로그인</h3><label>이메일<input name="email" type="email" required></label><label>비밀번호<input name="password" type="password" required></label><button id="signInButton">로그인</button></form></div><p id="authStatus" class="message"></p></section><section id="writeSection" class="card" hidden><h2>새 게시글 작성</h2><form id="writeForm"><label>제목 (1~200자)<input name="title" maxlength="200" required></label><label>본문<textarea name="content" rows="7" required></textarea></label><button id="writeButton">게시글 등록</button><p id="writeStatus" class="message"></p></form></section><section class="card"><form id="searchForm"><label>게시글 제목 검색</label><div class="search"><input id="searchInput" type="search" placeholder="검색할 제목을 입력하세요"><button>검색</button></div></form></section><section class="card"><div class="heading"><h2>게시글 목록</h2><p id="status" class="message"></p></div><div id="postList"></div></section><section id="detailSection" class="card" hidden><div class="heading"><h2>게시글 상세</h2><button id="closeDetailButton" type="button" class="cancel">닫기</button></div><h3 id="detailTitle"></h3><p id="detailContent"></p><p id="detailDate" class="date"></p><hr><h3>댓글</h3><div id="commentList"></div><form id="commentForm" hidden><label>댓글 내용<textarea id="commentContent" rows="4" required></textarea></label><button id="commentButton">댓글 등록</button></form><p id="commentStatus" class="message"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
