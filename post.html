<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시글 | Boardly</title><link rel="stylesheet" href="style.css?v=20261031-2"><link rel="stylesheet" href="fix.css?v=1"><style>.top-spacer{flex:1}.back-link{color:#555;font-size:14px;font-weight:700;text-decoration:none}.back-link:hover{color:#ff4500;text-decoration:underline}</style></head>
<body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">B</span>Boardly</a><a class="back-link" href="index.html">← 목록으로</a><span class="top-spacer"></span><button id="logoutButton" class="logout-button" hidden>로그아웃</button></header>
<main class="layout"><aside class="left-rail" aria-label="게시판 메뉴"><p class="rail-title">메뉴</p><a class="rail-link" href="index.html">⌂&nbsp; 전체 게시글</a><a class="rail-link is-active" href="#">▣&nbsp; 게시글 상세</a><div class="rail-note"><strong>자유 게시판</strong><span>목록으로 돌아가 다른 이야기도 살펴보세요.</span></div></aside>
<section class="feed detail-page"><p class="section-kicker">POST DETAIL</p><p id="pageStatus" class="message" role="status"></p><article id="postDetail" class="detail-card" hidden><h1 id="postTitle"></h1><p id="postContent" class="detail-content"></p><div id="mediaArea"></div><p id="postMeta" class="post-meta"></p><div id="postActions" class="actions"></div><hr><h2>댓글</h2><form id="commentForm" class="comment-form" hidden><label for="commentContent">댓글 작성</label><textarea id="commentContent" rows="4" required></textarea><div class="form-footer"><p id="commentStatus" class="message"></p><button id="commentButton">댓글 등록</button></div></form><div id="commentList" class="comment-list"></div></article>
<section id="authCard" class="auth-card" hidden><p id="accountEmail" class="message"></p><div id="authForms" class="auth-forms"><form id="signInForm" class="auth-form"><h2>로그인</h2><label>이메일<input name="email" type="email" required></label><label>비밀번호<input name="password" type="password" required></label><button id="signInButton">로그인</button></form><form id="signUpForm" class="auth-form"><h2>회원가입</h2><label>이메일<input name="email" type="email" required></label><label>비밀번호<input name="password" type="password" minlength="6" required></label><button id="signUpButton" class="secondary-button">회원가입</button></form></div><p id="authStatus" class="message"></p></section></section>
<aside class="right-rail"><section class="info-card"><div class="info-banner"></div><div class="info-body"><h2>Boardly 안내</h2><p>게시글을 읽고 댓글로 의견을 나눌 수 있습니다.</p></div></section><section class="rules-card"><h2>참여 규칙</h2><ol><li>서로를 존중해 주세요.</li><li>개인정보를 작성하지 마세요.</li><li>내가 작성한 내용만 수정·삭제할 수 있습니다.</li></ol></section></aside></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="post.js?v=20261031-3"></script></body></html>
